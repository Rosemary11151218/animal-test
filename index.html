<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测测你是什么动物人格</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif}
body{
  background:#fff7e8;
  color:#444;
  min-height:100vh;
  padding:20px;
}
.container{
  max-width:600px;
  margin:30px auto;
  background:#ffffff;
  border-radius:20px;
  padding:30px;
  box-shadow:0 4px 16px rgba(0,0,0,0.08);
}
h1{
  text-align:center;
  color:#f28c68;
  margin-bottom:10px;
}
.desc{
  text-align:center;
  color:#777;
  margin-bottom:8px;
}
.tip{
  font-size:12px;
  color:#aaa;
  text-align:center;
  margin-bottom:30px;
}
.page{display:none}
.page.active{display:block}
.question{
  font-size:18px;
  font-weight:500;
  margin-bottom:20px;
}
.opt{
  border:1px solid #f4d9c8;
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:12px;
  cursor:pointer;
  transition:0.25s;
}
.opt:hover{
  background:#ffe9dd;
  border-color:#f28c68;
}
.opt.selected{
  background:#f28c68;
  color:#fff;
  border-color:#f28c68;
}
.btn-wrap{
  text-align:center;
  margin-top:30px;
}
button{
  background:#f28c68;
  color:#fff;
  border:none;
  border-radius:30px;
  padding:12px 32px;
  font-size:16px;
  cursor:pointer;
}
button:disabled{
  background:#cccccc;
  cursor:not-allowed;
}
.result-box{
  text-align:center;
}
.animal-name{
  font-size:32px;
  color:#f28c68;
  font-weight:bold;
  margin:15px 0;
}
.animal-desc{
  line-height:1.7;
  color:#555;
}
.progress{
  height:6px;
  background:#eee;
  border-radius:99px;
  margin-bottom:25px;
  overflow:hidden;
}
.progress>div{
  height:100%;
  background:#f28c68;
  width:0%;
  transition:0.3s;
}
</style>
</head>
<body>
<div class="container">
  <!-- 首页 -->
  <div id="start" class="page active">
    <h1>🐾 动物人格小测试</h1>
    <p class="desc">凭第一直觉选择答案，看看你是什么小动物～</p>
    <p class="tip">提示：本测试仅收集结果用于趣味统计，不会收集个人隐私</p>
    <div class="btn-wrap">
      <button onclick="startTest()">开始测试</button>
    </div>
  </div>

  <!-- 答题页 -->
  <div id="quiz" class="page">
    <div class="progress"><div id="bar"></div></div>
    <div class="question" id="q-text"></div>
    <div id="opts-box"></div>
    <div class="btn-wrap">
      <button id="nextBtn" onclick="next()" disabled>下一题</button>
    </div>
  </div>

  <!-- 结果页 -->
  <div id="result" class="page">
    <div class="result-box">
      <h2>你的灵魂动物是</h2>
      <div class="animal-name" id="resName"></div>
      <div class="animal-desc" id="resDesc"></div>
      <div class="btn-wrap" style="margin-top:35px">
        <button onclick="restart()">重新测一遍</button>
      </div>
    </div>
  </div>
</div>

<script>
// 简道云webhook地址
const WEBHOOK_URL = "https://api.jiandaoyun.com/api/v1/automation/tenant/6ab336413a29a5962f0a3bfd/hooks/6ab3366ab56e6ab3374048697d929737cbfacfca9fde2e16";

const questions = [
  {
    q:"周末有空，你更想？",
    a:[
      {txt:"自己宅家休息充电",score:{cat:2,dog:0,deer:1,fox:1}},
      {txt:"约朋友出门吃喝玩乐",score:{cat:0,dog:2,deer:1,fox:1}},
      {txt:"去郊外散步看风景",score:{cat:1,dog:1,deer:2,fox:0}},
      {txt:"随便逛逛，发掘新奇小店",score:{cat:1,dog:1,deer:0,fox:2}}
    ]
  },
  {
    q:"遇到烦心事，你一般会？",
    a:[
      {txt:"安静独处，自己慢慢消化",score:{cat:2,dog:0,deer:1,fox:1}},
      {txt:"找人倾诉，说出来就舒服了",score:{cat:0,dog:2,deer:1,fox:1}},
      {txt:"尽量避开冲突，不想争吵",score:{cat:1,dog:1,deer:2,fox:0}},
      {txt:"冷静分析，想办法解决它",score:{cat:1,dog:1,deer:0,fox:2}}
    ]
  },
  {
    q:"别人对你的评价更接近？",
    a:[
      {txt:"高冷随性，不爱凑热闹",score:{cat:2,dog:0,deer:1,fox:1}},
      {txt:"热情开朗，很好打交道",score:{cat:0,dog:2,deer:1,fox:1}},
      {txt:"温柔体贴，共情力强",score:{cat:1,dog:1,deer:2,fox:0}},
      {txt:"脑子灵活，很有想法",score:{cat:1,dog:1,deer:0,fox:2}}
    ]
  },
  {
    q:"做决定的时候，你通常？",
    a:[
      {txt:"看心情，怎么舒服怎么来",score:{cat:2,dog:0,deer:1,fox:1}},
      {txt:"喜欢参考朋友的意见",score:{cat:0,dog:2,deer:1,fox:1}},
      {txt:"害怕伤害别人，容易犹豫",score:{cat:1,dog:1,deer:2,fox:0}},
      {txt:"独立思考，不容易被说服",score:{cat:1,dog:1,deer:0,fox:2}}
    ]
  },
  {
    q:"社交过后，你会觉得？",
    a:[
      {txt:"耗尽能量，需要独处回血",score:{cat:2,dog:0,deer:1,fox:1}},
      {txt:"很开心，越聊越兴奋",score:{cat:0,dog:2,deer:1,fox:1}},
      {txt:"很温和，但有一点点累",score:{cat:1,dog:1,deer:2,fox:0}},
      {txt:"在观察大家，心里默默判断",score:{cat:1,dog:1,deer:0,fox:2}}
    ]
  },
  {
    q:"更喜欢下面哪种生活节奏？",
    a:[
      {txt:"松弛自由，不受约束",score:{cat:2,dog:0,deer:1,fox:1}},
      {txt:"热闹温暖，有人陪伴",score:{cat:0,dog:2,deer:1,fox:1}},
      {txt:"宁静平和，岁月静好",score:{cat:1,dog:1,deer:2,fox:0}},
      {txt:"充满新鲜感，不断探索",score:{cat:1,dog:1,deer:0,fox:2}}
    ]
  }
];

const resultMap = {
  cat:{name:"🐱 猫咪",desc:"独立又傲娇，热爱自由。不刻意讨好谁，喜欢舒服松弛的状态。可以亲近，但也需要自己的小空间，外冷内热。"},
  dog:{name:"🐶 小狗",desc:"阳光真诚，热情友善。很看重陪伴，愿意信任别人，情绪直白。和你相处轻松温暖，是大家的开心果。"},
  deer:{name:"🦌 小鹿",desc:"温柔细腻，共情力超强。心思柔软，习惯照顾别人感受，不喜争吵，自带干净治愈的气质。"},
  fox:{name:"🦊 狐狸",desc:"聪慧敏锐，想法独特。观察力很强，遇事冷静，不盲从。有自己的主见，自带一点神秘魅力。"}
};

let currentQ = 0;
let score = {cat:0,dog:0,deer:0,fox:0};
let selectedIdx = null;

function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function startTest(){
  currentQ=0;
  score={cat:0,dog:0,deer:0,fox:0};
  renderQ();
  showPage("quiz");
}

function renderQ(){
  selectedIdx=null;
  const q = questions[currentQ];
  document.getElementById("q-text").innerText = q.q;
  const box = document.getElementById("opts-box");
  box.innerHTML="";
  q.a.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className="opt";
    div.innerText = opt.txt;
    div.onclick=()=>{
      selectedIdx=i;
      document.querySelectorAll(".opt").forEach(o=>o.classList.remove("selected"));
      div.classList.add("selected");
      document.getElementById("nextBtn").disabled=false;
    }
    box.appendChild(div);
  })
  //进度条
  const per = ((currentQ+1)/questions.length)*100;
  document.getElementById("bar").style.width = per+"%";
  document.getElementById("nextBtn").disabled=true;
}

function next(){
  const s = questions[currentQ].a[selectedIdx].score;
  score.cat += s.cat;
  score.dog += s.dog;
  score.deer += s.deer;
  score.fox += s.fox;
  currentQ++;
  if(currentQ >= questions.length){
    showResult();
    return;
  }
  renderQ();
}

async function showResult(){
  showPage("result");
  //找最高分
  let maxKey = "cat";
  let maxVal = score.cat;
  if(score.dog>maxVal){maxVal=score.dog;maxKey="dog"}
  if(score.deer>maxVal){maxVal=score.deer;maxKey="deer"}
  if(score.fox>maxVal){maxVal=score.fox;maxKey="fox"}
  const res = resultMap[maxKey];
  document.getElementById("resName").innerText = res.name;
  document.getElementById("resDesc").innerText = res.desc;

  // 提交数据到简道云
  const now = new Date().toLocaleString();
  const postData = {
    "提交时间": now,
    "猫得分": score.cat,
    "狗得分": score.dog,
    "鹿得分": score.deer,
    "狐狸得分": score.fox,
    "最终动物": res.name
  };
  try{
    await fetch(WEBHOOK_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(postData)
    })
  }catch(e){
    console.log("提交日志：",e);
  }
}

function restart(){
  showPage("start");
}
</script>
</body>
</html>
